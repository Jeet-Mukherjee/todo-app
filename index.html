<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do App</title>
    <link rel="stylesheet" href="newStyle.css">
</head>

<body>
    <main class="container">
        <div class="filters">
            <button data-filter="all">All</button>
            <button data-filter="pending">Pending</button>
            <button data-filter="completed">Completed</button>
        </div>
        <div id="msgContainer">
            <p id="tasksCount"></p>
            <p id="filteredCount" class="hidden"></p>
            <p id="msgElement" class="hidden"></p>
        </div>
        <div class="taskInputContainer">
            <input type="text" id="taskInput" placeholder="Add a task, press Enter" maxlength="30">
            <input type="text" id="taskSearch" placeholder="Search a task, press Enter" maxlength="30">
        </div>
        <div class="buttonContainer">
            <!-- <button id="addBtn">Add Task</button> -->
            <button id="clearAllTasksBtn">Clear All Tasks</button>
            <button id="clearCTaskBtn">Clear Completed Tasks</button>
            <button id="lastTaskBtn">Delete Last Task</button>
            <button id="undoLastDel">Undo Last Delete</button>
        </div>

        <ul id="taskList"></ul>

    </main>
    <script type="module" src="main.js"></script>
</body>

</html>
